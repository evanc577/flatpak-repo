id: org.freedesktop.Platform.VulkanLayer.low_latency_layer
branch: 25.08
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
build-options:
  prefix: /usr/lib/extensions/vulkan/low_latency_layer

modules:
  - name: vulkan-headers
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Headers.git
        tag: v1.4.360

  - name: vulkan-utility-libraries
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/KhronosGroup/Vulkan-Utility-Libraries.git
        tag: v1.4.360

  - name: low_latency_layer
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/Korthos-Software/low_latency_layer.git
        tag: v0.2.0
  - name: metadata
    buildsystem: simple
    build-commands:
      - install -DCm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: org.freedesktop.Platform.VulkanLayer.low_latency_layer.metainfo.xml
