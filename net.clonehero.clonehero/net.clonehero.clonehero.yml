id: net.clonehero.clonehero
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: clonehero
finish-args:
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --device=input
  - --persist=.clonehero
  - --filesystem=xdg-config/unity3d:create
  - --filesystem=home:ro
  - --share=network
modules:
  - name: hidapi
    sources:
      - type: archive
        url: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.15.0.tar.gz
        sha256: 5d84dec684c27b97b921d2f3b73218cb773cf4ea915caee317ac8fc73cef8136
    buildsystem: cmake-ninja
  - name: clonehero
    buildsystem: simple
    build-commands:
      # Install desktop, icon, metainfo
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications/
      - mkdir -p /app/share/icons/hicolor/128x128/apps
      - mv ${FLATPAK_ID}.png /app/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo

      # Install wrapper script
      - install -Dm755 clonehero -t /app/bin

      # Install extra script that extracts clonehero
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra

    sources:
      - type: script
        dest-filename: clonehero
        commands:
          - ulimit -Sn 65536
          - /app/extra/clonehero/clonehero "$@"
      - type: file
        path: net.clonehero.clonehero.desktop
      - type: file
        path: net.clonehero.clonehero.metainfo.xml
      - type: file
        path: net.clonehero.clonehero.png
      - type: extra-data
        filename: clonehero.tar
        only-arches: [x86_64]
        url: https://github.com/clonehero-game/releases/releases/download/v1.1.0.6142-final/Linux.x86_64-Standalone.tar
        sha256: 572971d93092283c5d0d52006a26b52ab8e8fb128dcfb42a3496de26c8aa231d
        size: 1172653056
      - type: script
        dest-filename: apply_extra
        commands:
          - tar -xf clonehero.tar --no-same-owner
          - mv 'Linux - Standalone' clonehero
          - chmod +x clonehero/clonehero
          - rm clonehero.tar
