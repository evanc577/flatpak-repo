id: org.codeberg.hatsnp.avis-imgv
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: avis-imgv
finish-args:
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-config/avis-imgv
  - --env=PERL5LIB=/app/lib/perl5
modules:
  - name: exiftool
    buildsystem: simple
    build-commands:
      - perl Makefile.PL INSTALL_BASE=${FLATPAK_DEST}
      - make
      - make install
    sources:
      - type: git
        url: https://github.com/exiftool/exiftool.git
        tag: 13.59
        commit: 2200871d9cef988051d2a99d67df3bda6cbb30a8
  - name: perl
    no-autogen: true
    config-opts:
      - -des
      - -Duseshrplib
    build-options:
      cflags: -fPIC
      ldflags: -fpic
      prefix: ${FLATPAK_DEST}
    cleanup:
      - /man
      - /lib/perl5/site_perl
      - "*.pod"
      - "*.h"
    post-install:
      - find /app/lib -name '*.so' -exec chmod 755 {} +
    sources:
      - type: archive
        url: https://www.cpan.org/src/5.0/perl-5.44.0.tar.gz
        sha256: 3b855066b92491cb40e86affb1ca57d1a388aa43e51b91c7806a32c2f65f96c3
      - type: script
        dest-filename: configure
        commands:
          - exec ./configure.gnu $@
  - name: avis-imgv
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/avis-imgv/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo build --offline --release --all-features
      - install -Dm0755 target/release/avis-imgv ${FLATPAK_DEST}/bin/avis-imgv
      - mkdir -p ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps
      - install -Dm0644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm0644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm0644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://codeberg.org/hatsnp/avis-imgv.git
        branch_name: master
        commit: 0413b7374b6827e31d731344cc45e0d3ad43fcaf
      - type: file
        path: org.codeberg.hatsnp.avis-imgv.png
      - type: file
        path: org.codeberg.hatsnp.avis-imgv.desktop
      - type: file
        path: org.codeberg.hatsnp.avis-imgv.metainfo.xml
      - cargo-sources.json
